<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Responsive Hybrid Navbar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="">
  <nav class="navbar navbar-dark bg-dark shadow-sm ">
    <div class="container-fluid">
      <!-- Logo -->
      <a class="navbar-brand d-flex align-items-center" href="#">
        <svg class="me-2" width="32" height="32" fill="none" viewBox="0 0 32 32">
          <path d="M4 24V8l8 8-8 8zm12-8l8-8v16l-8-8z" fill="#0d6efd" />
        </svg>
        <span class="fw-bold fs-3 text-primary">LIFELINKR</span>
      </a>

      <!-- Desktop Nav (visible on lg and up) -->
      <ul class="navbar-nav flex-row gap-3 d-none d-lg-flex ms-auto align-items-center">
        <li class="nav-item">
          <a class="nav-link text-white fs-5" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white fs-5" href="#">Why Choose Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white fs-5" href="#">Benefits</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-white fs-5" href="#">FAQs</a>
        </li>
        <li class="nav-item">
          <a class="btn btn-outline-light rounded-pill px-4 py-2" href="#">Schedule Demo</a>
        </li>
      </ul>

      <!-- Toggler (only on small/medium screens) -->
      <button class="navbar-toggler d-lg-none border rounded-3 p-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Offcanvas Menu (for mobile) -->
      <div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="offcanvasNavbar">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title">Menu</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
          <ul class="navbar-nav gap-3">
            <li class="nav-item">
              <a class="nav-link text-white fs-5" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fs-5" href="#">Why Choose Us</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fs-5" href="#">Benefits</a>
            </li>
            <li class="nav-item">
              <a class="nav-link text-white fs-5" href="#">FAQs</a>
            </li>
            <li class="nav-item">
              <a class="btn btn-outline-light rounded-pill px-4 py-2" href="#">Schedule Demo</a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
